<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="petalGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.9"/>
      <stop offset="60%" style="stop-color:#7c3aed;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#1e0533;stop-opacity:0.6"/>
    </radialGradient>
    <radialGradient id="centerGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Outer petals -->
  <g transform="translate(100,100)" filter="url(#glow)">
    <!-- Petal 1 -->
    <path d="M0,0 C-15,-35 -5,-65 0,-75 C5,-65 15,-35 0,0Z" fill="url(#petalGrad)" transform="rotate(0)"/>
    <path d="M0,0 C-15,-35 -5,-65 0,-75 C5,-65 15,-35 0,0Z" fill="url(#petalGrad)" transform="rotate(45)"/>
    <path d="M0,0 C-15,-35 -5,-65 0,-75 C5,-65 15,-35 0,0Z" fill="url(#petalGrad)" transform="rotate(90)"/>
    <path d="M0,0 C-15,-35 -5,-65 0,-75 C5,-65 15,-35 0,0Z" fill="url(#petalGrad)" transform="rotate(135)"/>
    <path d="M0,0 C-15,-35 -5,-65 0,-75 C5,-65 15,-35 0,0Z" fill="url(#petalGrad)" transform="rotate(180)"/>
    <path d="M0,0 C-15,-35 -5,-65 0,-75 C5,-65 15,-35 0,0Z" fill="url(#petalGrad)" transform="rotate(225)"/>
    <path d="M0,0 C-15,-35 -5,-65 0,-75 C5,-65 15,-35 0,0Z" fill="url(#petalGrad)" transform="rotate(270)"/>
    <path d="M0,0 C-15,-35 -5,-65 0,-75 C5,-65 15,-35 0,0Z" fill="url(#petalGrad)" transform="rotate(315)"/>

    <!-- Inner petals -->
    <path d="M0,0 C-10,-22 -3,-42 0,-50 C3,-42 10,-22 0,0Z" fill="#a855f7" opacity="0.85" transform="rotate(22.5)"/>
    <path d="M0,0 C-10,-22 -3,-42 0,-50 C3,-42 10,-22 0,0Z" fill="#a855f7" opacity="0.85" transform="rotate(67.5)"/>
    <path d="M0,0 C-10,-22 -3,-42 0,-50 C3,-42 10,-22 0,0Z" fill="#a855f7" opacity="0.85" transform="rotate(112.5)"/>
    <path d="M0,0 C-10,-22 -3,-42 0,-50 C3,-42 10,-22 0,0Z" fill="#a855f7" opacity="0.85" transform="rotate(157.5)"/>
    <path d="M0,0 C-10,-22 -3,-42 0,-50 C3,-42 10,-22 0,0Z" fill="#a855f7" opacity="0.85" transform="rotate(202.5)"/>
    <path d="M0,0 C-10,-22 -3,-42 0,-50 C3,-42 10,-22 0,0Z" fill="#a855f7" opacity="0.85" transform="rotate(247.5)"/>
    <path d="M0,0 C-10,-22 -3,-42 0,-50 C3,-42 10,-22 0,0Z" fill="#a855f7" opacity="0.85" transform="rotate(292.5)"/>
    <path d="M0,0 C-10,-22 -3,-42 0,-50 C3,-42 10,-22 0,0Z" fill="#a855f7" opacity="0.85" transform="rotate(337.5)"/>

    <!-- Gear ring -->
    <circle r="20" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.7"/>
    <circle r="22" fill="none" stroke="#7c3aed" stroke-width="0.5" stroke-dasharray="3,3" opacity="0.6"/>

    <!-- Gear teeth -->
    <rect x="-2" y="-24" width="4" height="4" fill="#f59e0b" opacity="0.8" transform="rotate(0)"/>
    <rect x="-2" y="-24" width="4" height="4" fill="#f59e0b" opacity="0.8" transform="rotate(30)"/>
    <rect x="-2" y="-24" width="4" height="4" fill="#f59e0b" opacity="0.8" transform="rotate(60)"/>
    <rect x="-2" y="-24" width="4" height="4" fill="#f59e0b" opacity="0.8" transform="rotate(90)"/>
    <rect x="-2" y="-24" width="4" height="4" fill="#f59e0b" opacity="0.8" transform="rotate(120)"/>
    <rect x="-2" y="-24" width="4" height="4" fill="#f59e0b" opacity="0.8" transform="rotate(150)"/>
    <rect x="-2" y="-24" width="4" height="4" fill="#f59e0b" opacity="0.8" transform="rotate(180)"/>
    <rect x="-2" y="-24" width="4" height="4" fill="#f59e0b" opacity="0.8" transform="rotate(210)"/>
    <rect x="-2" y="-24" width="4" height="4" fill="#f59e0b" opacity="0.8" transform="rotate(240)"/>
    <rect x="-2" y="-24" width="4" height="4" fill="#f59e0b" opacity="0.8" transform="rotate(270)"/>
    <rect x="-2" y="-24" width="4" height="4" fill="#f59e0b" opacity="0.8" transform="rotate(300)"/>
    <rect x="-2" y="-24" width="4" height="4" fill="#f59e0b" opacity="0.8" transform="rotate(330)"/>

    <!-- Center -->
    <circle r="12" fill="url(#centerGrad)" opacity="0.95"/>
    <circle r="6" fill="#0a0a0f"/>
    <circle r="3" fill="#f59e0b"/>
    <circle r="1.5" fill="#0a0a0f"/>

    <!-- Circuit lines -->
    <line x1="0" y1="-12" x2="0" y2="-20" stroke="#f59e0b" stroke-width="0.5" opacity="0.6"/>
    <line x1="12" y1="0" x2="20" y2="0" stroke="#f59e0b" stroke-width="0.5" opacity="0.6"/>
    <line x1="0" y1="12" x2="0" y2="20" stroke="#f59e0b" stroke-width="0.5" opacity="0.6"/>
    <line x1="-12" y1="0" x2="-20" y2="0" stroke="#f59e0b" stroke-width="0.5" opacity="0.6"/>

    <!-- Stem -->
    <line x1="0" y1="0" x2="0" y2="80" stroke="#7c3aed" stroke-width="2" opacity="0.5"/>
    <path d="M0,40 C-15,35 -20,20 -15,15" fill="none" stroke="#7c3aed" stroke-width="1.5" opacity="0.5"/>
    <path d="M-15,15 C-8,18 -5,25 0,28" fill="none" stroke="#7c3aed" stroke-width="1" opacity="0.5"/>
  </g>
</svg>
